<script>
document.addEventListener("DOMContentLoaded", () => {

  const pages = document.querySelectorAll(".page");
  const navButtons = document.querySelectorAll(".navlist button");
  const navlist = document.getElementById("navlist");
  const menuToggle = document.getElementById("menuToggle");
  const topbar = document.getElementById("topbar");

  function goTo(id) {
    const targetPage = document.getElementById("page-" + id);

    // Falls eine ungültige Seite aufgerufen wird, abbrechen
    if (!targetPage) {
      console.warn("Seite nicht gefunden:", id);
      return;
    }

    // Alle Seiten deaktivieren
    pages.forEach(page => {
      page.classList.remove("active");
    });

    // Gewünschte Seite aktivieren
    targetPage.classList.add("active");

    // Navigation aktualisieren
    navButtons.forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.target === id
      );
    });

    // Mobile Navigation schließen
    if (navlist) {
      navlist.classList.remove("open");
    }

    // Nach oben scrollen
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    // Reveal-Animation neu starten
    targetPage.querySelectorAll(".reveal").forEach(element => {
      element.style.animation = "none";

      // Reflow erzwingen
      void element.offsetWidth;

      element.style.animation = "";
    });
  }

  // Navigation
  navButtons.forEach(button => {
    button.addEventListener("click", () => {
      const target = button.dataset.target;

      if (target) {
        goTo(target);
      }
    });
  });

  // Logo / Brand zurück zur Startseite
  const brand = document.querySelector(".brand");

  if (brand) {
    brand.addEventListener("click", () => {
      goTo("start");
    });
  }

  // Mobile Menü
  if (menuToggle && navlist) {
    menuToggle.addEventListener("click", () => {
      navlist.classList.toggle("open");

      const isOpen = navlist.classList.contains("open");

      menuToggle.setAttribute(
        "aria-expanded",
        String(isOpen)
      );
    });
  }

  // Menü schließen, wenn außerhalb geklickt wird
  document.addEventListener("click", event => {
    if (!navlist || !menuToggle) return;

    const clickedInsideMenu =
      navlist.contains(event.target);

    const clickedToggle =
      menuToggle.contains(event.target);

    if (
      navlist.classList.contains("open") &&
      !clickedInsideMenu &&
      !clickedToggle
    ) {
      navlist.classList.remove("open");
      menuToggle.setAttribute("aria-expanded", "false");
    }
  });

  // Scroll-Effekt für die obere Navigation
  function updateTopbar() {
    if (!topbar) return;

    topbar.classList.toggle(
      "scrolled",
      window.scrollY > 8
    );
  }

  window.addEventListener(
    "scroll",
    updateTopbar,
    { passive: true }
  );

  // Initialen Zustand setzen
  updateTopbar();

  // Startseite laden
  goTo("start");

});
</script>
